---
layout: post
title: "Post Drafts"
permalink: /post-drafts/
category: hidden
---

{% for post in site.posts %}
    {% if post.path contains '_drafts/posts/' %}
        <li {% if post.url == page.url %}class="active"{% endif %}>
            <a href="{{ site.baseurl }}{{ post.url }}">
                {{ post.title }}
            </a>
        </li>
    {% endif %}
{% endfor %}
